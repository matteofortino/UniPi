<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Esame 26/06/2024</title>

    <style>
      .contenitore {
        width: 500px;
        background-color: antiquewhite;
        padding: 20px;
      }
      table {
        border-collapse: collapse;
        margin-bottom: 20px;
        border: 4px solid black;
      }
      table > tr > td {
        width: 50px;
        height: 50px;
        border: 2px solid black;
      }
      button {
        width: 60px;
        height: 30px;
        font-weight: bold;
      }
      .corretti,
      .presenti {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="contenitore">
      <button id="btn">Avvia</button>
      <p class="tempo"></p>
      <p class="tentativi"></p>
    </div>

    <script>
      const contenitore = document.querySelector(".contenitore");
      const btn = document.getElementById("btn");
      const tempo = document.querySelector(".tempo");
      const tentativi = document.querySelector(".tentativi");

      const COLS = 6;
      const ROWS = 10;

      let timer;
      let count;

      let sequenza = [];
      const colori = ["yellow", "red", "green", "blue", "purple"];

      let i, j;
      let corretti;
      let presenti;

      let vinto = false;
      let timeoutId;

      function resetta() {
        timer = 60;
        count = 1;
        const caselle = document.querySelectorAll(".cell");
        const caselleCorretti = document.querySelectorAll(".corretti");
        const casellePresenti = document.querySelectorAll(".presenti");
        caselleCorretti.forEach((casella) => (casella.innerText = ""));
        casellePresenti.forEach((casella) => (casella.innerText = ""));
        btn.disabled = false;
        if (vinto) {
          tentativi.innerText = "Hai vinto in " + count + " tentativi";
        } else {
          tentativi.innerText = "Hai perso, riprova!";
        }
        vinto = false;
        i = 0;
        j = 0;
        setTimeout(() => {
          caselle.forEach((casella) => {
            casella.style.backgroundColor = "white";
          });
          tempo.innerText = "";
          tentativi.innerText = "";
        }, 2000);
        clearTimeout(timeoutId);
      }

      function controllaRiga(i, j) {
        corretti = 0;
        presenti = 0;
        count++;
        let row = [];
        const caselle = Array.from(document.querySelectorAll(".cell"));
        caselle.forEach((casella) => {
          let [i_, j_] = casella.id.split("|");
          if (i == i_ && casella.classList.contains("cell")) {
            row.push(casella);
          }
        });

        const copiaSequenza = [...sequenza];
        const copiaRow = [...row];

        for (let i = 0; i < 4; i++) {
          if (row[i].style.backgroundColor == sequenza[i]) {
            corretti++;
            copiaRow[i] = null;
            copiaSequenza[i] = null;
          }
        }

        for (let i = 0; i < 4; i++) {
          if (copiaRow[i] !== null) {
            let idx = copiaSequenza.indexOf(copiaRow[i]);
            if (idx !== -1) {
              presenti++;
              copiaRow[idx] = null;
            }
          }
        }

        const caselleCorretti = document.querySelectorAll(".corretti");
        const casellePresenti = document.querySelectorAll(".presenti");

        caselleCorretti.forEach((casella) => {
          let [i_, j_] = casella.id.split("|");
          if (i == i_) casella.innerText = corretti;
        });
        casellePresenti.forEach((casella) => {
          let [i_, j_] = casella.id.split("|");
          if (i == i_) casella.innerText = presenti;
        });

        if (corretti == 4) {
          vinto = true;
          resetta();
        }
      }

      function coloraCasella(e) {
        let target;
        caselle = Array.from(document.querySelectorAll(".cell"));

        caselle.forEach((casella) => {
          let [i_, j_] = casella.id.split("|");
          if (i == i_ && j == j_) {
            target = casella;
            return;
          }
        });

        switch (e.key) {
          case "y":
            target.style.backgroundColor = "yellow";
            break;
          case "g":
            target.style.backgroundColor = "green";
            break;
          case "b":
            target.style.backgroundColor = "blue";
            break;
          case "r":
            target.style.backgroundColor = "red";
            break;
          case "p":
            target.style.backgroundColor = "purple";
            break;
          default:
            coloraCasella();
            break;
        }
        j++;
        j = j % 4;
        if (j % 4 == 0) {
          if (i == 10) {
            resetta();
            return;
          }
          controllaRiga(i, j);
          i++;
        }
      }

      function creaSequenza() {
        sequenza = [];
        for (let i = 0; i < 4; i++) {
          const colore = colori[Math.floor(Math.random() * colori.length)];
          sequenza.push(colore);
        }
        sequenza = ["yellow", "purple", "yellow", "red"];
        console.log(sequenza);
      }

      function mostraGriglia() {
        let table = document.createElement("table");
        for (let i = 0; i < ROWS; i++) {
          let tr = document.createElement("tr");
          table.append(tr);
          for (let j = 0; j < COLS; j++) {
            let td = document.createElement("td");
            tr.append(td);
            td.id = i + "|" + j;
            td.classList.add("cell");
            td.style.backgroundColor = "white";
            if (j == 4) {
              td.style.backgroundColor = "pink";
              td.classList.add("corretti");
            }
            if (j == 5) {
              td.style.backgroundColor = "green";
              td.classList.add("presenti");
            }
            if (j == 4 || j == 5) td.classList.remove("cell");
          }
        }
        contenitore.prepend(table);
      }

      function iniziaTimer() {
        if (timer == 0) {
          resetta();
          return;
        }
        tempo.innerText = "Tempo rimanente: " + timer;
        timer--;

        timeoutId = setTimeout(iniziaTimer, 1000);
      }

      function inizia() {
        i = 0;
        j = 0;
        timer = 60;
        count = 1;
        btn.disabled = true;
        iniziaTimer();
        creaSequenza();
        document.addEventListener("keypress", coloraCasella);
      }

      btn.addEventListener("click", inizia);
      mostraGriglia();
    </script>
  </body>
</html>
