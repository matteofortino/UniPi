<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .contenitore {
        display: flex;
        height: 250px;
      }
      .form {
        height: 100%;
        width: 50%;
        padding: 20px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        background-color: lightblue;
      }
      input {
        max-height: 20px;
      }
      input:invalid {
        background-color: red;
      }
      button {
        max-height: 20px;
      }
      .ombrelloni {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 50%;
        height: 100%;
        padding: 20px;
        background-color: orange;
      }
      .prenotazioni {
        width: 100%;
        min-height: 100px;
        background-color: yellow;
        padding: 20px;
      }
      .ombrellone {
        display: inline-block;
        width: 30px;
        height: 30px;
        font-weight: bold;
        font-size: 20px;
        text-align: center;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="contenitore">
      <div class="form">
        <label for="data">Data</label>
        <input type="date" id="data" name="data" required />

        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" pattern="^[A-Z][a-z]{1,}$" />

        <label for="cognome">Cognome</label>
        <input
          type="text"
          id="cognome"
          name="cognome"
          pattern="^[A-Z][a-z]{1,}$"
        />
        <button type="button" id="button">Scegli</button>
      </div>

      <div class="ombrelloni"></div>
    </div>
    <div class="prenotazioni">
      <p>Prenotazioni</p>
      <ol class="lista"></ol>
    </div>

    <script>
      const button = document.getElementById("button");
      const nomeInput = document.getElementById("nome");
      const cognomeInput = document.getElementById("cognome");
      const dataInput = document.getElementById("data");
      const lista = document.querySelector(".lista");

      const ROWS = 3;
      const COLS = 5;

      let ombrelloni = new Array(ROWS * COLS).fill(0);
      let prenotazioni = {};

      button.addEventListener("click", () => {
        const nome = nomeInput.value;
        const cognome = cognomeInput.value;
        const data = dataInput.value;

        mostraOmbrelloni();
      });

      function mostraOmbrelloni() {
        const ombrelloniDiv = document.querySelector(".ombrelloni");
        ombrelloniDiv.innerHTML = "";

        for (let i = 0; i < ROWS; i++) {
          const row = document.createElement("div");
          row.classList.add("row");

          for (let j = 0; j < COLS; j++) {
            const ombrellone = document.createElement("span");
            if (ombrelloni[i * COLS + j] === 0) ombrellone.textContent = `0`;
            else ombrellone.textContent = `X`;

            ombrellone.classList.add("ombrellone");
            ombrellone.addEventListener("click", scegliOmbrellone);
            ombrellone.id = `${i}|${j}`;
            row.appendChild(ombrellone);
          }

          ombrelloniDiv.appendChild(row);
        }
      }

      function scegliOmbrellone(event) {
        const id = event.target.id;
        const [i, j] = id.split("|").map(Number);
        const index = i * COLS + j;

        if (ombrelloni[index] === 0) {
          ombrelloni[index] = 1;

          prenotazioni[`${nomeInput.value}_${cognomeInput.value}`]++;

          const nome = nomeInput.value;
          const cognome = cognomeInput.value;
          const data = dataInput.value;

          const li = document.createElement("li");
          li.textContent = `${data}: ${nome} ${cognome}, ombrellone (${i}, ${j})`;
          lista.appendChild(li);

          mostraOmbrelloni();
        } else {
          alert("Ombrellone già prenotato!");
        }
      }
    </script>
  </body>
</html>
