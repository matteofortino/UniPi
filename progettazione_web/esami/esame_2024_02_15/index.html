<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Esame 15/02/2025</title>
    <style>
      th,
      td {
        border: 2px solid black;
        width: 50px;
        height: 50px;
      }
      th {
        background-color: pink;
        text-align: center;
      }
      td {
        background-color: white;
      }
      .table {
        border-collapse: collapse;
        margin-bottom: 20px;
      }
      .button {
        padding: 15px;
      }
      .contenitore {
        display: flex;
        padding: 30px;
        background-color: gray;
        width: fit-content;
      }
      .text {
        height: fit-content;
        padding: 20px;
        color: blue;
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <div class="contenitore_esterno">
      <div class="contenitore">
        <table class="table">
          <tr>
            <th>A</th>
            <th>S</th>
            <th>D</th>
            <th>F</th>
            <th>G</th>
            <th>H</th>
            <th>J</th>
            <th>K</th>
          </tr>
        </table>
        <div class="text"></div>
      </div>
    </div>
    <button type="button" class="button">Avvia</button>
  </body>
  <script>
    const table = document.querySelector(".table");
    const button = document.querySelector(".button");
    const letters = document.getElementsByClassName("th");
    const text = document.querySelector(".text");
    const contenitore = document.querySelector(".contenitore");
    let intervalId;
    let punti = 0;

    function pulisciTabella() {
      const COLS = 8;
      const ROWS = 4;
      for (let i = 0; i < ROWS; i++) {
        for (let j = 0; j < COLS; j++) {
          const id = i + "|" + j;
          const cell = document.getElementById(id);
          cell.textContent = "";
        }
      }
    }
    function gameOver() {
      button.disabled = false;
      clearInterval(intervalId);
      const div = document.createElement("div");
      div.textContent = "Hai fatto " + punti + " punti";
      document.querySelector(".contenitore_esterno").append(div);
      pulisciTabella();
    }
    function onKeyPress(event) {
      const key = String(event.key).toLowerCase();
      let col = -1;
      switch (key) {
        case "a":
          col = 0;
          break;
        case "s":
          col = 1;
          break;
        case "d":
          col = 2;
          break;
        case "f":
          col = 3;
          break;
        case "g":
          col = 4;
          break;
        case "h":
          col = 5;
          break;
        case "j":
          col = 6;
          break;
        case "k":
          col = 7;
          break;
      }
      showNumber(col);
    }
    function showNumber(col) {
      const ROWS = 4;
      for (let i = ROWS - 1; i >= 0; i--) {
        const id = i + "|" + col;
        const cell = document.getElementById(id);
        const CIFRA = Number(text.textContent.split(":")[1]);
        if (i == 0 && cell.textContent) {
          gameOver();
          break;
        }
        if (!cell.textContent) {
          cell.textContent = CIFRA;
          const id = Number(i + 1) + "|" + col;
          const previousCell = document.getElementById(id);
          if (cell.textContent == previousCell.textContent) {
            cell.textContent = "";
            previousCell.textContent = "";
            punti++;
          }
          break;
        }
      }
    }

    button.addEventListener("click", () => {
      punti = 0;
      button.disabled = true;
      document.addEventListener("keypress", onKeyPress);
      intervalId = setInterval(() => {
        const CIFRA = Math.floor(Math.random() * 9);
        text.textContent = "Prossima Cifra: " + CIFRA;
      }, 1000);
    });

    function creaTabella() {
      const ROWS = 4;
      const COLS = 8;

      // riga aggiuntiva
      for (let i = 0; i < ROWS; i++) {
        const tr = document.createElement("tr");
        for (let j = 0; j < COLS; j++) {
          const td = document.createElement("td");
          td.id = i + "|" + j;
          tr.append(td);
        }
        table.append(tr);
      }
    }
    creaTabella();
  </script>
</html>
